---
# carbon-ubuntu.yml — DEPRECATED, superseded by site-ubuntu.yml + bin/join
# (constellation-ubuntu-join, 2026-09-05).
#
# This file did carbon's one-time 2026-08-23 Arch-exit rebuild: restoring the
# dev environment from hub:~/backups/carbon-arch-exit/ (state tarball, SECRETS
# tarball, package manifests, WIP repo branches). That restore was a one-time
# recovery, not part of the general "join a fresh Ubuntu box" contract — it is
# NOT migrated into the shared role set, and is not needed again now that
# carbon is converged. Kept here (not deleted) so this filename still gives a
# clear pointer instead of a missing-file error, and so this migration's git
# history stays attached to a live file. The original task list (packages,
# apt keyrings/repos, docker, ollama/slack/obsidian/nats-server installers,
# rustup/npm/pipx toolchain, systemd units) now lives generalized in:
#   ansible/roles/ubuntu-base/    — OS packages, sudo, apt keyrings, shell/PATH
#   ansible/roles/fleet-member/   — dotfiles, toolchain, fleet-sync, node.toml
#   ansible/host_vars/carbon.yml  — carbon's specific package/keyring/installer list
#
# Run instead:
#   bin/join carbon
#   bin/join carbon --check   # dry-run; should report zero changes (converged)

- name: DEPRECATED — see ansible/site-ubuntu.yml + bin/join
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Point to the replacement
      ansible.builtin.fail:
        msg: >-
          carbon-ubuntu.yml is deprecated. Run `bin/join carbon` instead
          (wraps `ansible-playbook site-ubuntu.yml --limit carbon`). See
          ansible/roles/ubuntu-base/, ansible/roles/fleet-member/, and
          ansible/host_vars/carbon.yml for where this playbook's logic moved.

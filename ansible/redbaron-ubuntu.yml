---
# redbaron-ubuntu.yml — DEPRECATED, superseded by site-ubuntu.yml + bin/join
# (constellation-ubuntu-join, 2026-09-05).
#
# This file's ad-hoc system/user layer tasks (apt keyrings/repos with format-
# by-extension handling, NVIDIA driver, ollama/nats-server installers,
# rustup/npm/pipx toolchain, dotfiles clone) are now generalized as:
#   ansible/roles/ubuntu-base/     — OS packages, sudo, apt keyrings, shell/PATH
#   ansible/roles/fleet-member/    — dotfiles (chezmoi, not the raw git-clone +
#                                    install.sh this file used), toolchain,
#                                    fleet-sync, node.toml
#   ansible/host_vars/redbaron.yml — redbaron's GPU driver + package list
#
# The apt-keyring-format-by-extension fix this file introduced (916dd2e) and
# the redbaron target-over-ssh fix (941cd29) are both preserved as explicit,
# commented tasks in ubuntu-base/tasks/main.yml rather than left to memory.
#
# Run instead:
#   bin/join redbaron
#   bin/join redbaron --check

- name: DEPRECATED — see ansible/site-ubuntu.yml + bin/join
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Point to the replacement
      ansible.builtin.fail:
        msg: >-
          redbaron-ubuntu.yml is deprecated. Run `bin/join redbaron` instead
          (wraps `ansible-playbook site-ubuntu.yml --limit redbaron`). See
          ansible/roles/ubuntu-base/, ansible/roles/fleet-member/, and
          ansible/host_vars/redbaron.yml for where this playbook's logic moved.
